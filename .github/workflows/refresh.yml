name: Refresh freshness data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh freshness data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-freshness.mjs
      - name: Commit freshness.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/freshness.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh freshness data"
            git push
          fi
